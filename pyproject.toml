[project]
name = "pyclig"
dynamic = ["version"]
description = "A Python Click wrapper with Command Line Interface Guidelines (CLIG) paradigms."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICEN[CS]E*", "COPYRIGHT"]
authors = [{ name = "Andrew Ridyard", email = "developer.surface832@passmail.com" }]
maintainers = [{ name = "Andrew Ridyard", email = "developer.surface832@passmail.com" }]
requires-python = ">=3.11"
keywords = ["cli", "click", "clig", "rich"]
classifiers = [
    # 3 - Alpha | 4 - Beta | 5 - Production/Stable
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["click~=8.5", "rich~=15.0"]

[dependency-groups]
dev = [
    "coverage~=7.17",
    "pytest~=9.0",
    "pymarkdownlnt~=0.9",
    "mypy~=2.4",
    "prek~=0.5",
    "ruff~=0.17",
]

[project.urls]
Changelog = "https://github.com/andyrids/pyclig/blob/main/CHANGELOG.md"
Documentation = "https://github.com/andyrids/pyclig/blob/main/README.md"
Issues = "https://github.com/andyrids/pyclig/issues"
Repository = "https://github.com/andyrids/pyclig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.coverage.run]
omit = ["tests/*", "*/src_test*/*"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyclig"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# lets SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYCLIG work under hatch-vcs
dist_name = "pyclig"
local_scheme = "no-local-version"
version_scheme = "guess-next-dev"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
filterwarnings = ["error"]
log_cli = true
log_cli_level = "INFO"
testpaths = ["tests"]
tmp_path_retention_policy = "failed"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
