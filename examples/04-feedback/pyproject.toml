[project]
name = "checkup"
version = "0.1.0"
description = "pyclig example: STDERR feedback, logging & quiet mode."
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["click", "pyclig"]

[project.scripts]
checkup = "checkup:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["checkup.py"]

[tool.uv.sources]
pyclig = { workspace = true }
