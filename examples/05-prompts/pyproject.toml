[project]
name = "depot"
version = "0.1.0"
description = "pyclig example: confirmations, secrets & the non-TTY refusal."
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["click", "pyclig"]

[project.scripts]
depot = "depot:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["depot.py"]

[tool.uv.sources]
pyclig = { workspace = true }
