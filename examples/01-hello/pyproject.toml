[project]
name = "hello"
version = "0.1.0"
description = "pyclig example: a single command & the conventions it gets for free."
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["click", "pyclig"]

[project.scripts]
hello = "hello:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["hello.py"]

[tool.uv.sources]
pyclig = { workspace = true }
