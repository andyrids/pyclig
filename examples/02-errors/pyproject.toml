[project]
name = "pantry"
version = "0.1.0"
description = "pyclig example: a group, expected errors, hints & exit codes."
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["click", "pyclig"]

[project.scripts]
pantry = "pantry:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["pantry.py"]

[tool.uv.sources]
pyclig = { workspace = true }
