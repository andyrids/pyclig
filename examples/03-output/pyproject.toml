[project]
name = "fruit"
version = "0.1.0"
description = "pyclig example: one emit call for human, plain & JSON output."
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["click", "pyclig", "rich"]

[project.scripts]
fruit = "fruit:cli"

[dependency-groups]
dev = ["pytest~=9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["fruit.py"]

[tool.uv.sources]
pyclig = { workspace = true }
